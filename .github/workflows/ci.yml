name: CI
on: [push, pull_request]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check publishAllPublicationsToLocalBuildRepository --console=plain
      - run: ./gradlew -p samples/coil-desktop runRelease --console=plain
      - run: ./gradlew -p samples/coil-kmp runRelease --console=plain
      - name: Coil negative control
        run: |
          if ./gradlew -p samples/coil-desktop runRelease -PkeepKitNegative=true --console=plain > negative.log 2>&1; then
            echo "Expected missing-fetcher failure, but the negative control passed"
            exit 1
          fi
          grep -q "Unable to create a fetcher" negative.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: |
            negative.log
            build/reports/tests
            build/repository
            samples/*/build/compose/logs
